modLoader="javafml"
loaderVersion="${loader_range}"
issueTrackerURL="https://github.com/SlimeKnights/TinkersConstruct/issues"
logoFile="logo.png"
license="MIT"

[[mixins]]
    config="mantle.mixins.json"

[[mixins]]
    config="tconstruct.mixins.json"

[[mods]]
    modId="tconstruct"
    version="${version}"
    displayName="Tinkers' Construct"
    authors="SlimeKnights; zhuchuovo (NeoForge 1.21.1 port); SlimefunNewHorizons (1.21.11 port)"
    enumExtensions="META-INF/enumextensions.json"
    description='''
Unofficial NeoForge port of Tinkers' Construct 3.12. Tinker a little, build a little, tinker a little more.
    '''

[[mods]]
    modId="mantle"
    version="${mantle_version}"
    displayName="Mantle"
    authors="Slime Knights"
    logoFile="Mantle.png"
    description='''
Shared code for Slime Knights mods and others. Integrated into this Tinkers' Construct jar.
    '''

[[dependencies.mantle]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mantle]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="mantle"
    type="required"
    versionRange="${mantle_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jei"
    type="optional"
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"
