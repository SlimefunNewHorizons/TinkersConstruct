# NeoForge 1.21.11 requires Java 21. Six GiB avoids compiler OOMs in this large
# workspace; Mantle source is integrated into this project.
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
systemProp.java.net.preferIPv4Stack=true

mod_version=3.13.3

# Minecraft / NeoForge
minecraft_version=1.21.11
minecraft_range=[1.21.11,1.22)
neo_version=21.11.48
neo_range=[21.11.0,21.12.0)
loader_range=[1,)
parchment_minecraft_version=1.21.11
parchment_version=2025.12.20

# Mantle is integrated into this jar (src/main/java/slimeknights/mantle) and
# declared as its own mod in neoforge.mods.toml.
mantle_version=1.13.1
mantle_range=[1.13.1,)

# Optional compatibility
jei_version=27.54.0.112
jei_range=[27.0.0,28.0.0)
