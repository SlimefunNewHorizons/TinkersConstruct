# NeoForge 1.21.1 requires Java 21. Six GiB avoids compiler OOMs in this large
# workspace; Mantle source is integrated into this project.
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
systemProp.java.net.preferIPv4Stack=true

mod_version=3.13.3

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)
neo_version=21.1.241
neo_range=[21.1.0,21.2.0)
loader_range=[4,)
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# Mantle is integrated into this jar (src/main/java/slimeknights/mantle) and
# declared as its own mod in neoforge.mods.toml.
mantle_version=1.13.1
mantle_range=[1.13.1,)

# Optional compatibility
jei_version=19.39.0.368
jei_range=[19.0.0,20.0.0)
